<svg width="1200" height="412" viewBox="0 0 1200 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NullFilter: an AiTM proxy forges the HTTP Origin header, but the browser-signed clientDataJSON origin exposes it and the server blocks the login">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, Menlo, monospace; }
    .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .pkt  { animation: 10s linear infinite; }
    .p1 { animation-name: p1; } .p2 { animation-name: p2; } .p3 { animation-name: p3; } .p4 { animation-name: p4; }
    .a1 { animation: a1 10s linear infinite; } .a2 { animation: a2 10s linear infinite; }
    .a3 { animation: a3 10s linear infinite; } .a4 { animation: a4 10s linear infinite; }
    @keyframes p1 { 0% { transform: translateX(0); opacity: 0 } 2% { opacity: 1 } 12% { transform: translateX(176px); opacity: 1 } 14%, 100% { transform: translateX(176px); opacity: 0 } }
    @keyframes p2 { 0%, 14% { transform: translateX(0); opacity: 0 } 16% { opacity: 1 } 27% { transform: translateX(176px); opacity: 1 } 29%, 100% { transform: translateX(176px); opacity: 0 } }
    @keyframes p3 { 0%, 38% { transform: translateX(0); opacity: 0 } 40% { opacity: 1 } 51% { transform: translateX(-176px); opacity: 1 } 53%, 100% { transform: translateX(-176px); opacity: 0 } }
    @keyframes p4 { 0%, 53% { transform: translateX(0); opacity: 0 } 55% { opacity: 1 } 66% { transform: translateX(-176px); opacity: 1 } 68%, 100% { transform: translateX(-176px); opacity: 0 } }
    @keyframes a1 { 0%, 13% { opacity: 0 } 16%, 94% { opacity: 1 } 99%, 100% { opacity: 0 } }
    @keyframes a2 { 0%, 19% { opacity: 0 } 22%, 94% { opacity: 1 } 99%, 100% { opacity: 0 } }
    @keyframes a3 { 0%, 25% { opacity: 0 } 28%, 94% { opacity: 1 } 99%, 100% { opacity: 0 } }
    @keyframes a4 { 0%, 31% { opacity: 0 } 34%, 94% { opacity: 1 } 99%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .pkt, .a1, .a2, .a3, .a4 { animation: none } }
  </style>

  <rect width="1200" height="412" rx="10" fill="#0a0c10"/>
  <rect x="0.5" y="0.5" width="1199" height="411" rx="10" fill="none" stroke="#21262d"/>

  <!-- header -->
  <text x="48" y="98" class="sans" font-size="54" font-weight="700" letter-spacing="-1" fill="#e6edf3">NullFilter</text>
  <text x="50" y="128" class="mono" font-size="13" fill="#7d8590">AiTM detection telemetry · canary deception · red-team research</text>
  <text x="1152" y="72" class="mono" font-size="12" fill="#484f58" text-anchor="end">zero-dependency · node:crypto · MIT</text>
  <line x1="48" y1="150" x2="1152" y2="150" stroke="#21262d"/>

  <!-- topology -->
  <g class="mono">
    <!-- victim -->
    <rect x="48" y="176" width="240" height="72" rx="4" fill="#0f1319" stroke="#30363d"/>
    <text x="64" y="205" font-size="13" fill="#e6edf3">victim browser</text>
    <text x="64" y="228" font-size="11" fill="#7d8590">window.location = :8080</text>

    <!-- proxy -->
    <rect x="480" y="176" width="240" height="72" rx="4" fill="#0f1319" stroke="#f85149" stroke-dasharray="4 3"/>
    <text x="496" y="205" font-size="13" fill="#e6edf3">reverse proxy (evilginx)</text>
    <text x="496" y="228" font-size="11" fill="#7d8590">:8080 → :3000 · sub_filter</text>
    <text x="720" y="168" font-size="10.5" fill="#f85149" text-anchor="end">adversary</text>

    <!-- origin -->
    <rect x="912" y="176" width="240" height="72" rx="4" fill="#0f1319" stroke="#30363d"/>
    <rect x="912" y="176" width="240" height="72" rx="4" fill="none" stroke="#f85149" class="a4"/>
    <text x="928" y="205" font-size="13" fill="#e6edf3">origin + verifier</text>
    <text x="928" y="228" font-size="11" fill="#7d8590">:3000 · verifyWebAuthnAssertion()</text>
    <text x="1152" y="168" font-size="10.5" fill="#3fb950" text-anchor="end">protected</text>
    <text x="1152" y="268" font-size="11" fill="#f85149" text-anchor="end" class="a4">403 · login refused</text>

    <!-- wires -->
    <line x1="288" y1="212" x2="480" y2="212" stroke="#30363d" stroke-width="1.5"/>
    <line x1="720" y1="212" x2="912" y2="212" stroke="#30363d" stroke-width="1.5"/>
    <text x="384" y="200" font-size="10.5" fill="#7d8590" text-anchor="middle">assertion + clientDataJSON</text>
    <text x="384" y="232" font-size="10.5" fill="#484f58" text-anchor="middle">signed in the browser</text>
    <text x="816" y="200" font-size="10.5" fill="#d29922" text-anchor="middle">Origin: localhost:3000</text>
    <text x="816" y="232" font-size="10.5" fill="#484f58" text-anchor="middle">header rewritten</text>

    <!-- packets (hidden unless animated) -->
    <rect x="292" y="208" width="8" height="8" fill="#e6edf3" opacity="0" class="pkt p1"/>
    <rect x="724" y="208" width="8" height="8" fill="#d29922" opacity="0" class="pkt p2"/>
    <rect x="900" y="208" width="8" height="8" fill="#f85149" opacity="0" class="pkt p3"/>
    <rect x="468" y="208" width="8" height="8" fill="#f85149" opacity="0" class="pkt p4"/>
  </g>

  <!-- log -->
  <g class="mono" font-size="12.5">
    <text x="48" y="306" fill="#7d8590" class="a1">22:03:56.903Z  POST /api/webauthn/login/verify</text>
    <g class="a2">
      <text x="64" y="330" fill="#7d8590">http.origin</text>
      <text x="250" y="330" fill="#d29922">http://localhost:3000</text>
      <text x="446" y="330" fill="#484f58">forged by proxy</text>
    </g>
    <g class="a3">
      <text x="64" y="352" fill="#7d8590">clientDataJSON.origin</text>
      <text x="250" y="352" fill="#e6edf3">http://localhost:<tspan fill="#f85149">8080</tspan></text>
      <text x="446" y="352" fill="#484f58">signed by browser</text>
    </g>
    <g class="a4">
      <text x="64" y="378" fill="#7d8590">verdict</text>
      <text x="250" y="378" fill="#f85149" font-weight="700">BLOCK_WEBAUTHN_ORIGIN_MISMATCH</text>
    </g>
  </g>

  <!-- hexdump of the signed bytes -->
  <g class="mono" font-size="11.5">
    <text x="652" y="306" fill="#484f58">clientDataJSON (decoded, excerpt)</text>
    <text x="652" y="330" fill="#7d8590" textLength="500" lengthAdjust="spacing" xml:space="preserve">+0x00  22 6f 72 69 67 69 6e 22 3a 22 68 74 74 70 3a 2f  |"origin":"http:/|</text>
    <text x="652" y="352" fill="#7d8590" textLength="500" lengthAdjust="spacing" xml:space="preserve">+0x10  2f 6c 6f 63 61 6c 68 6f 73 74 3a <tspan fill="#f85149">38 30 38 30</tspan> 22  |/localhost:<tspan fill="#f85149">8080</tspan>"|</text>
    <text x="1152" y="378" fill="#484f58" text-anchor="end">the header said :3000 — the signed bytes say <tspan fill="#f85149">:8080</tspan></text>
  </g>
</svg>
